name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

env:
  # Pinned live777 commit for the e2e live777 server (the cable messages API
  # used by EVENTS_CABLE is merged but unreleased; no registry image tracks
  # main). Keep compose.yml in sync.
  LIVE777_REF: 07a20d211e554c1d5f9394914f011d3eb41a8a22

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Build embedded WebApp and audit production dependencies
        run: npm ci && npm run build && npm audit --omit=dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check format, lints and tests
        run: npm run test:rust
      - name: Install libopus for caption-bot
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config
      - name: Check caption-bot format, lints and tests
        run: cd caption-bot && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --all-targets

  e2e:
    name: Playwright e2e (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Room events transport: SSE (default) and the live777 cable
        # datachannel (opt-in). SSE-stubbing specs skip on the cable leg.
        transport: [sse, cable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      # No registry image tracks live777 main (pushes happen on version tags
      # only), and the cable messages API has no release yet — build the
      # pinned commit, layer-cached via GitHub Actions cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build live777 from the pinned commit
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/binbat/live777.git#${{ env.LIVE777_REF }}
          file: docker/Dockerfile.liveion
          load: true
          tags: liveion:local
          cache-from: type=gha,scope=liveion-e2e
          cache-to: type=gha,mode=max,scope=liveion-e2e
      - name: Start live777
        run: docker run -d --name live777 -p 7777:7777 liveion:local
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          EVENTS_CABLE: ${{ matrix.transport == 'cable' && '1' || '' }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.transport }}
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build image
        run: docker build -t woom:ci .
      # Build-only smoke for the caption bot. The STT server image
      # (caption-bot/scripts) is intentionally not built here: it downloads
      # a large ASR model tarball at image build time.
      - name: Build caption-bot image
        run: docker build -t woom-caption:ci caption-bot/
      - name: Start container
        run: |
          docker run -d --name woom-ci \
            -p 4000:4000 \
            -v woom-ci-data:/data \
            -e SECRET=ci-9f6c2a84d17b43e0a5c98f21e6d04b7a \
            woom:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs woom-ci
          exit 1
      - name: Check SPA and missing asset responses
        run: |
          curl -fsS -H 'Accept: text/html' http://localhost:4000/meeting/example >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/javascript' http://localhost:4000/assets/missing.js)" = 404
      - name: Clean up
        if: ${{ !cancelled() }}
        run: |
          docker rm -f woom-ci
          docker volume rm woom-ci-data
