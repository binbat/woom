services:
  live777:
    # Pinned live777 commit (the cable messages API used by EVENTS_CABLE is
    # merged but unreleased). Bump by updating the hash — keep
    # LIVE777_REF in .github/workflows/test.yml in sync. The image builds
    # from source on first `up` (slow); rebuild with
    # `docker compose build live777`.
    build:
      context: https://github.com/binbat/live777.git#d1ef16ada3374428c031776871370365cf186a05
      dockerfile: docker/Dockerfile.liveion
    image: liveion-main:local
    container_name: live777
    hostname: live777
    ports:
      - "7777:7777/tcp"

  stt:
    build: caption-bot/scripts
    profiles: ["captions"]
    hostname: stt
    expose:
      - "6006"

  caption-bot:
    build: caption-bot
    profiles: ["captions"]
    depends_on:
      - stt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The WOOM server usually runs on the host during development.
      WOOM_URL: http://host.docker.internal:4000
      LIVE777_URL: http://live777:7777
      STT_WS_URL: ws://stt:6006
      CAPTION_TOKEN: ${CAPTION_TOKEN:?set CAPTION_TOKEN}
      LIVE777_TOKEN: ${LIVE777_TOKEN:-}

networks:
  default:
    name: woom
