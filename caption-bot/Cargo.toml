[package]
name = "woom-caption"
version = "0.1.0"
edition = "2021"
description = "Caption bot for WOOM: subscribes to participant audio via WHEP from Live777, transcribes it with a streaming STT server, and posts caption segments back to WOOM"
license = "MIT"

# Standalone workspace: this crate is not part of the parent repository's
# Rust package and must not join its (implicit) workspace.
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
opus = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rtc = "0.21.1"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
webrtc = { version = "0.21.1", features = ["runtime-tokio"] }
